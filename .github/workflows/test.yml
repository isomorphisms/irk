name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: r-lib/actions/setup-r@v2
      - run: sh model/fetch.sh
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python irk.py examples/downsize_image.irk -o generated.R
      - run: Rscript tests/generated_runtime.R generated.R
